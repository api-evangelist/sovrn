name: Sovrn
description: >-
  Sovrn is an advertising technology and content monetization company that helps
  online publishers, advertisers, and creators earn revenue from their websites and
  audiences. Its platform spans Ad Exchange (an omnichannel programmatic demand
  pipeline connecting publisher inventory to buyers and DSPs), Signal (ad-inventory
  and yield optimization), Commerce (affiliate and commerce-content monetization,
  formerly VigLink, with access to 50,000+ merchants), and Data solutions for
  first-party data activation. Sovrn is headquartered in Boulder, Colorado. This API
  Evangelist profile was created from a venture portfolio lead and enriched from
  Sovrn's public security, legal, and status surfaces; no public developer portal or
  OpenAPI was discoverable at enrichment time.
