  description: >-
    Hosted, beta Model Context Protocol server exposing Sovrn Commerce affiliate data, campaigns and products
    to AI clients — twelve tools covering price search, link checking, product recommendations and eight
    reporting cuts, plus a setup prompt and a campaigns resource. Authenticated with the same Commerce
    Secret Key as the REST APIs; rate limits are inherited per tool from the backing API.
  humanURL: https://developer.sovrn.com/docs/mcp
