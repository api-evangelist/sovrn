image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/sovrn.png
name: Sovrn
description: >-
  Sovrn is an advertising technology and content monetization company that helps online
  publishers, advertisers, and creators earn revenue from their websites and audiences. Its
  platform spans Ad Exchange (an omnichannel programmatic demand pipeline connecting publisher
  inventory to buyers and DSPs), Signal (ad-inventory and yield optimization), Commerce
  (affiliate and commerce-content monetization, formerly VigLink, with access to tens of
  thousands of merchants), and Data solutions for first-party data activation. Sovrn publishes
  a ReadMe-hosted developer center at developer.sovrn.com carrying eight OpenAPI definitions
  across seventeen operations — affiliate link checking, real-time bid pricing on clicks,
  campaign management, real-time commission reporting, merchant rate summaries, product
  recommendations, price comparisons, promo codes, and Ad Exchange performance reporting —
  plus a beta hosted Commerce MCP server at mcp.sovrn.com/commerce, an Agent Skills discovery
  document, and llms.txt files on three hosts. Sovrn is headquartered in Boulder, Colorado.
