        required: false
        schema:
          type: string
      - name: linkUtmMedium
        in: query
        description: Comma seperated list of link UTM mediums
        required: false
        schema:
          type: string
      - name: linkUtmCampaign
        in: query
        description: Comma seperated list of link UTM campaigns
        required: false
        schema:
          type: string
      - name: linkUtmTerm
        in: query
        description: Comma seperated list of link UTM terms
        required: false
        schema:
          type: string
      - name: linkUtmContent
        in: query
        description: Comma seperated list of link UTM contents
        required: false
        schema:
          type: string
      - name: programType
        in: query
        description: Type of program (CPA/CPC)
        required: false
        schema:
          type: string
          enum:
          - CPC
          - CPA
      - name: sovrnProduct
        in: query
        description: Sovrn Product
        required: false
        schema:
          $ref: '#/components/schemas/SovrnProductModel'
      - name: deviceType
        in: query
        description: Type of device
        required: false
        schema:
          $ref: '#/components/schemas/DeviceTypeModel'
      - name: country
        in: query
        description: Two-letter ISO country code
        required: false
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuidsResponseModel'
        '400':
          description: Bad request
        '401':
          description: Authorization information is missing or invalid
        '404':
          description: Page data not found
        5XX:
          description: Unexpected error
