note: >-
  Sovrn publishes no pricing page and no plan tiers. Its business model is inverted from a
  metered API — publishers are paid BY Sovrn out of a revenue share on monetized ad
  impressions and affiliate commissions, rather than paying for API calls. Signing up for a
  free Sovrn Platform account and getting a campaign approved is what grants API access;
  there is no paid tier, no quota to buy and no overage. The only published monetary terms
  are payout thresholds, recorded below because they are the closest thing to a commercial
  contract Sovrn puts in public.
